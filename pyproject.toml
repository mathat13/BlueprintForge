[project]
name = "blueprint-forge"
version = "0.1.1"
description = "..."
readme = "README.md"
authors = [
    { name = "mathat13", email = "lovell.jwz@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.13.4",
    "pyyaml>=6.0.3",
    "typer>=0.27.1",
]

[project.scripts]
blueprint-forge = "blueprint_forge.bootstrap:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "factory-boy>=3.3.3",
    "pytest>=9.1.1",
    "pytest-mock>=3.15.1",
]

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true
