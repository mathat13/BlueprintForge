QuestionService.load:
  local:
    valid:
      - dictionary containing non-empty questions mapping
    invalid:
      - non-dictionary
      - dictionary without a non-empty questions mapping
  integration:
      happy:
        - valid source data produces valid QuestionCollection
      unhappy:
        - QuestionData validation failures propagate
        - Question construction failures propagate
        - QuestionCollection construction failures propagate
        - YAMLParser failures propagate